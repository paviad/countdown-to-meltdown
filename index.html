<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8:00 PM ET Countdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }

        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -5;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            filter: brightness(0.6) contrast(1.1);
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -4;
        }

        /* Loading indicator for the AI image */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -3;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 100, 0, 0.3);
            border-top: 3px solid #ff6400;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Embers/Particles */
        .ember {
            position: absolute;
            background: linear-gradient(to top, #ffcc00, #ff4400);
            border-radius: 50%;
            filter: blur(1px);
            z-index: -1;
            animation: rise var(--duration) linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(110vh) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-20vh) translateX(var(--drift)) scale(0.2); opacity: 0; }
        }

        .glass {
            background: rgba(10, 5, 0, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 120, 0, 0.3);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 100, 0, 0.1);
        }

        .mono {
            font-family: 'JetBrains+Mono', monospace;
        }

        .glow {
            text-shadow: 0 0 30px rgba(255, 100, 0, 0.8), 0 0 10px rgba(255, 200, 0, 0.4);
        }

        .gradient-text {
            background: linear-gradient(to bottom, #ffffff 30%, #ffbb00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .unit-label {
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-size: 0.7rem;
            opacity: 0.7;
            font-weight: 800;
            color: #ffaa00;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <!-- AI Background -->
    <img id="bg-image" alt="Background Explosion">
    <div class="bg-overlay"></div>
    
    <div id="loader">
        <div class="spinner"></div>
        <p class="text-orange-500 font-bold tracking-widest text-sm uppercase">Igniting Explosion...</p>
    </div>

    <div id="ember-container"></div>

    <main class="w-full max-w-4xl relative z-10">
        <div class="text-center mb-12">
            <h1 class="text-2xl md:text-4xl font-black mb-6 text-orange-500 italic tracking-tight leading-tight drop-shadow-[0_5px_15px_rgba(0,0,0,1)]">
                Power Plant day, and Bridge Day, all wrapped up in one,
            </h1>
            <h2 class="text-xl md:text-2xl font-light tracking-[0.4em] uppercase text-orange-200/50 mb-2">Countdown To</h2>
            <h3 class="text-7xl md:text-9xl font-black gradient-text tracking-tighter glow uppercase">8:00 PM ET</h3>
            <p id="ny-time-display" class="mt-8 text-orange-400 font-bold tracking-widest opacity-90 text-sm md:text-base drop-shadow-md"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-8">
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center transform hover:scale-105 transition-transform duration-500">
                <span id="hours" class="text-6xl md:text-8xl font-extrabold mono glow">00</span>
                <span class="unit-label mt-4">Hours</span>
            </div>
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center transform hover:scale-105 transition-transform duration-500">
                <span id="minutes" class="text-6xl md:text-8xl font-extrabold mono glow">00</span>
                <span class="unit-label mt-4">Minutes</span>
            </div>
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center transform hover:scale-105 transition-transform duration-500">
                <span id="seconds" class="text-6xl md:text-8xl font-extrabold mono glow">00</span>
                <span class="unit-label mt-4">Seconds</span>
            </div>
        </div>

        <div id="event-message" class="hidden mt-12 text-center glass p-8 rounded-3xl border-2 border-orange-500 bg-orange-950/40 shadow-[0_0_100px_rgba(255,100,0,0.4)]">
            <p class="text-4xl font-black text-white animate-pulse tracking-tighter glow">CRITICAL REACHED: BLAST COMMENCED</p>
        </div>
    </main>

    <script>
        const apiKey = ""; // API key provided at runtime

        async function generateBackground() {
            const prompt = "A cinematic, highly detailed, dramatic massive explosion with thick black billowing smoke and intense bright orange fire, involving a futuristic power plant and a massive bridge collapsing in the background, night time, embers and sparks in the air, 4k resolution, epic scale.";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                if (!response.ok) throw new Error('Generation failed');
                
                const result = await response.json();
                const base64Data = result.predictions[0].bytesBase64Encoded;
                const imgElement = document.getElementById('bg-image');
                imgElement.src = `data:image/png;base64,${base64Data}`;
                
                imgElement.onload = () => {
                    imgElement.style.opacity = "1";
                    document.getElementById('loader').style.display = "none";
                };
            } catch (error) {
                console.error("Failed to generate background:", error);
                // Fallback to a dark gradient if API fails
                document.getElementById('loader').innerHTML = '<p class="text-orange-500">Blast Imagery Offline</p>';
            }
        }

        // Create Embers
        const emberContainer = document.getElementById('ember-container');
        for (let i = 0; i < 60; i++) {
            const ember = document.createElement('div');
            ember.className = 'ember';
            const size = Math.random() * 4 + 1;
            ember.style.width = `${size}px`;
            ember.style.height = `${size}px`;
            ember.style.left = `${Math.random() * 100}%`;
            ember.style.animationDelay = `${Math.random() * 8}s`;
            ember.style.setProperty('--duration', `${Math.random() * 2 + 3}s`);
            ember.style.setProperty('--drift', `${Math.random() * 200 - 100}px`);
            emberContainer.appendChild(ember);
        }

        const targetHour = 20; // 8 PM
        const targetMinute = 0;
        const targetSecond = 0;

        function getNYTime() {
            const now = new Date();
            const nyString = now.toLocaleString("en-US", {timeZone: "America/New_York"});
            return new Date(nyString);
        }

        function updateCountdown() {
            const nowNY = getNYTime();
            let targetNY = new Date(nowNY);
            targetNY.setHours(targetHour, targetMinute, targetSecond, 0);

            if (nowNY >= targetNY) {
                targetNY.setDate(targetNY.getDate() + 1);
            }

            const diffMs = targetNY.getTime() - nowNY.getTime();

            if (diffMs <= 1000) {
                document.getElementById('event-message').classList.remove('hidden');
            } else {
                document.getElementById('event-message').classList.add('hidden');
            }

            const hours = Math.floor(diffMs / (1000 * 60 * 60));
            const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            const timeString = nowNY.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            });
            document.getElementById('ny-time-display').textContent = `ESTABLISHED NY TIME: ${timeString}`;

            requestAnimationFrame(updateCountdown);
        }

        window.onload = () => {
            generateBackground();
            updateCountdown();
        };
    </script>
</body>
</html>
