<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8:00 PM ET Countdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* The Core Explosion Burst */
        .explosion-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(255,100,0,0.4) 0%, rgba(255,50,0,0.1) 40%, transparent 70%);
            z-index: -2;
            animation: pulse-explosion 4s ease-in-out infinite alternate;
        }

        /* Shockwave Rings */
        .shockwave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 160, 0, 0.2);
            border-radius: 50%;
            z-index: -1;
            animation: shockwave-expand 6s linear infinite;
        }

        .shockwave:nth-child(2) { animation-delay: 2s; }
        .shockwave:nth-child(3) { animation-delay: 4s; }

        /* Embers/Particles */
        .ember {
            position: absolute;
            background: linear-gradient(to top, #ff9500, #ff3c00);
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
            animation: float-up var(--duration) linear infinite;
            opacity: 0.6;
        }

        @keyframes pulse-explosion {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
        }

        @keyframes shockwave-expand {
            0% { width: 0; height: 0; opacity: 1; border-width: 10px; }
            100% { width: 150vw; height: 150vw; opacity: 0; border-width: 1px; }
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 100, 0, 0.2);
            box-shadow: 0 0 40px rgba(255, 50, 0, 0.1);
        }

        .mono {
            font-family: 'JetBrains+Mono', monospace;
        }

        .glow {
            text-shadow: 0 0 20px rgba(255, 100, 0, 0.6);
        }

        .gradient-text {
            background: linear-gradient(to bottom, #ffffff, #ff9d00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .unit-label {
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 0.75rem;
            opacity: 0.6;
            font-weight: 600;
            color: #ff9d00;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <!-- Explosion Background Elements -->
    <div class="explosion-core"></div>
    <div class="shockwave"></div>
    <div class="shockwave"></div>
    <div class="shockwave"></div>
    
    <!-- Generated embers will go here -->
    <div id="ember-container"></div>

    <main class="w-full max-w-4xl relative z-10">
        <div class="text-center mb-12">
            <h1 class="text-2xl md:text-3xl font-bold mb-6 text-orange-400 italic tracking-tight leading-tight drop-shadow-lg">
                Power Plant day, and Bridge Day, all wrapped up in one,
            </h1>
            <h2 class="text-xl md:text-2xl font-light tracking-[0.3em] uppercase opacity-60 mb-2">Countdown To</h2>
            <h3 class="text-6xl md:text-8xl font-black gradient-text tracking-tight glow">8:00 PM ET</h3>
            <p id="ny-time-display" class="mt-6 text-orange-300 font-medium tracking-wide opacity-80"></p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8">
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center">
                <span id="hours" class="text-5xl md:text-8xl font-extrabold mono glow">00</span>
                <span class="unit-label mt-4">Hours</span>
            </div>
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center">
                <span id="minutes" class="text-5xl md:text-8xl font-extrabold mono glow">00</span>
                <span class="unit-label mt-4">Minutes</span>
            </div>
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center">
                <span id="seconds" class="text-5xl md:text-8xl font-extrabold mono glow">00</span>
                <span class="unit-label mt-4">Seconds</span>
            </div>
            <div class="glass rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center">
                <span id="millis" class="text-5xl md:text-8xl font-extrabold mono glow opacity-40">00</span>
                <span class="unit-label mt-4">Ms</span>
            </div>
        </div>

        <div id="event-message" class="hidden mt-12 text-center glass p-6 rounded-2xl border-orange-500 bg-orange-950/20">
            <p class="text-3xl font-bold text-orange-400 animate-bounce">THE BLAST HAS BEGUN!</p>
        </div>
    </main>

    <script>
        // Create random embers
        const emberContainer = document.getElementById('ember-container');
        for (let i = 0; i < 40; i++) {
            const ember = document.createElement('div');
            ember.className = 'ember';
            const size = Math.random() * 6 + 2;
            const left = Math.random() * 100;
            const delay = Math.random() * 5;
            const duration = Math.random() * 3 + 4;
            
            ember.style.width = `${size}px`;
            ember.style.height = `${size}px`;
            ember.style.left = `${left}%`;
            ember.style.animationDelay = `${delay}s`;
            ember.style.setProperty('--duration', `${duration}s`);
            
            emberContainer.appendChild(ember);
        }

        const targetHour = 20; // 8 PM
        const targetMinute = 0;
        const targetSecond = 0;

        function getNYTime() {
            return new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
        }

        function updateCountdown() {
            const nowNY = getNYTime();
            let targetNY = new Date(nowNY);
            targetNY.setHours(targetHour, targetMinute, targetSecond, 0);

            if (nowNY >= targetNY) {
                targetNY.setDate(targetNY.getDate() + 1);
            }

            const diffMs = targetNY.getTime() - nowNY.getTime();

            if (diffMs <= 1000) {
                document.getElementById('event-message').classList.remove('hidden');
            } else {
                document.getElementById('event-message').classList.add('hidden');
            }

            const hours = Math.floor(diffMs / (1000 * 60 * 60));
            const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);
            const millis = Math.floor((diffMs % 1000) / 10);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            document.getElementById('millis').textContent = String(millis).padStart(2, '0');

            const timeString = nowNY.toLocaleTimeString('en-US', { 
                timeZone: 'America/New_York', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            });
            document.getElementById('ny-time-display').textContent = `New York Time: ${timeString}`;

            requestAnimationFrame(updateCountdown);
        }

        updateCountdown();
    </script>
</body>
</html>
